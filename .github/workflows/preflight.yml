name: preflight
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Unit + schema tests
        run: npm test
      - name: MCP smoke (initialize -> tools/list -> tools/call)
        run: node scripts/mcp-smoke.mjs
      - name: Showcase build
        run: node scripts/showcase.mjs
